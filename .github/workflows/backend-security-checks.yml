name: Backend Security Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "supabase/**"
      - "package.json"
      - ".github/workflows/backend-security-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          # No npm lockfile is currently tracked in this repository.
          # Do not enable setup-node's npm cache until a lockfile is committed.

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-package-lock --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint
