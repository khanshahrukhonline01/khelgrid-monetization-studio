name: NodeJS Build & Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Report Node.js and npm versions
        # Record exact resolved runtime versions for reproducible CI diagnostics.
        run: |
          node --version
          npm --version

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Apply repository Prettier formatting (temporary repair branch only)
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/lint-format-generator'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          npx eslint . --format json --output-file /tmp/eslint-report.json || true
          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("/tmp/eslint-report.json", "utf8"));
          const files = report
            .filter((entry) => entry.messages.some((message) => message.ruleId === "prettier/prettier"))
            .map((entry) => entry.filePath);
          fs.writeFileSync("/tmp/prettier-files.txt", files.join("\n"));
          console.log(`Prettier formatting will be applied to ${files.length} files.`);
          NODE

          mapfile -t FILES < /tmp/prettier-files.txt
          if [ "${#FILES[@]}" -gt 0 ]; then
            npx prettier --write "${FILES[@]}"
          fi

          # Remove the one-use formatter step from the final change.
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/webpack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${#FILES[@]}" -gt 0 ]; then
            git add -- "${FILES[@]}"
          fi
          git add .github/workflows/webpack.yml
          if ! git diff --cached --quiet; then
            git commit -m "style: format lint-flagged files and clean opportunity types"
            git push origin "HEAD:refs/heads/${GITHUB_HEAD_REF}"
          else
            echo "No formatting or type changes needed."
          fi

      - name: Build
        run: npm run build

      - name: Run Tests
        run: npm test

      - name: Run lint
        run: npm run lint
