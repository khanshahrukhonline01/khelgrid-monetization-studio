name: NodeJS Build & Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Regenerate lockfile for review (temporary agent branch only)
        if: github.head_ref == 'agent/lockfile-artifact'
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Upload regenerated lockfile for review (temporary agent branch only)
        if: github.head_ref == 'agent/lockfile-artifact'
        uses: actions/upload-artifact@v4
        with:
          name: repaired-package-lock
          path: package-lock.json
          retention-days: 1

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-package-lock --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Run Tests
        run: npm test
